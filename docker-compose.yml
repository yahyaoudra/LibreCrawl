services:
  librecrawl:
    build: .
    ports:
      - "5000:5000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:5000', timeout=5)\nPY"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    volumes:
      - librecrawl_data:/app/data

    environment:
      - FLASK_APP=main.py
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=replace-with-a-long-random-secret-key
      - LOCAL_MODE=false
      - REGISTRATION_DISABLED=false
      - DEMO_MODE=false
      - DANGEROUSLY_SKIP_AUTH=false

    restart: unless-stopped

    command: >
      sh -c "
      FLAGS='';
      if [ \"$$LOCAL_MODE\" = \"true\" ]; then
        FLAGS=\"$$FLAGS --local\";
      fi;
      if [ \"$$REGISTRATION_DISABLED\" = \"true\" ]; then
        FLAGS=\"$$FLAGS --disable-register\";
      fi;
      if [ \"$$DEMO_MODE\" = \"true\" ]; then
        FLAGS=\"$$FLAGS --demo\";
      fi;
      if [ \"$$DANGEROUSLY_SKIP_AUTH\" = \"true\" ]; then
        FLAGS=\"$$FLAGS --dangerously-skip-auth\";
      fi;
      python main.py $$FLAGS"

    shm_size: "2gb"

volumes:
  librecrawl_data:
